spring.application.name=NotificationHub

spring.datasource.url=jdbc:h2:mem:notificationhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

server.address=127.0.0.1
server.port=8080

spring.kafka.bootstrap-servers=localhost:9092
notifyhub.kafka.topic=notification-events
notifyhub.kafka.consumer-group=notification-service

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
